defining_characteristics: "A low-magnification morphotype class for a chain-forming diatom recognised by the overall shape and structure of the chain, since genus-level valve detail is not resolvable at low mag. Use for the first distinct low-mag chain form; the specific appearance is defined by the ideal images. (Fill in the diagnostic chain shape for morphotype 1 once representative images are chosen.) Key features: diatom chain matching the reference images for morphotype 1."
