class_id: diatom_chain_1
display_name: Diatom Chain 1 (low mag)
group: Diatoms
optics: [low-mag]
one_liner: "Low-magnification Chaetoceros chain with 'Spiky' morphology."
defining_characteristics: "A low-magnification morphotype class originally described as 'diatom_chain_spikes' but most likely belonging to a species or complex of Chaetoceros. This morphotype has thicker setae and appears to have more than two setae per cell. Key features: Thick setae, thin chained cells."
distinguishing_from:
  - class: diatom_chain_2
    note: "Morphotype 2 has spiral chains (helical)."
  - class: diatom_chain_3
    note: "Morphotypes 3 are straight chains without thick setae."
