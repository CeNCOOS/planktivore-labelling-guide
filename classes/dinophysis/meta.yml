class_id: dinophysis
display_name: Dinophysis
group: Dinoflagellates
optics: [high-mag, low-mag]
one_liner: "Laterally flattened armored dinoflagellate with a crown and wing/flange (aka lists) on side."
defining_characteristics: "A thecate dinoflagellate that is strongly compressed laterally, so it looks like two watch-glasses joined edge to edge (clamshell). The anterior end bears a funnel-shaped cingular list (collar), and prominent wing (or sail) sulcal lists project from the left ventral margin. Often filled with food vaccole. Key features: lateral flattening, sail-like sulcal lists."
distinguishing_from:
  - class: ceratium
    note: "Ceratium has long apical and antapical horns; Dinophysis has no horns but conspicuous cingular and sulcal lists."
  - class: prorocentrum
    note: "Prorocentrum splits into two flat valves along a sagittal suture with an apical spine; Dinophysis has the funnel collar and sail lists."
references:
  - title: "Dinophysis — Phyto'pedia - The Phytoplankton Encclopaedia Project (UBC)"
    url: https://phytoplankton.eoas.ubc.ca/research/phytoplankton/dinoflagellates/dinophysis/dinophysis_genus.html
  - title: "Dinophysis - PhytoGallery UCSC"
    url: http://oceandatacenter.ucsc.edu/PhytoGallery/Dinoflagellates/dinophysis.html

