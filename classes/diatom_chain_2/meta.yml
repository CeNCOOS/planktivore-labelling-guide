class_id: diatom_chain_2
display_name: Diatom Chain 2 (low mag)
group: Diatoms
optics: [low-mag]
one_liner: "Low-magnification diatom-chain morphotype 2 with coiling or helical, long diatom chains."
defining_characteristics: "A low-magnification morphotype class for a chain-forming diatom with a distinct helical or coiling shape. Cells possibly beloning to __Eucampia__ or __Asterionellopsis__. Key features: Long diatom chain with a helical or coiling shape."
distinguishing_from:
  - class: diatom_chain_1
    note: "Morphotypes 1 has large thick setae."
  - class: diatom_chain_3
    note: "Morphotypes 3 diatom chains are straight and large, thick setae are absent."
