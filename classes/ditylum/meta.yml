class_id: ditylum
display_name: Ditylum
group: Diatoms
optics: [high-mag, low-mag]
one_liner: "Box or prism-shaped centric diatom with a single long spine projecting from the centre of each valve."
defining_characteristics: "Cells are elongate prisms but appear rectangular in girdle view, with a distinctive central spine emerging from the middle of each valve plus a ring of small marginal spines. Often solitary or in short chains and relatively large. Ditylum brightwellii is the common species. Key features: prismatic (polygonal cross-section) box shape, prominent central valve spine, chloroplasts are visbile."
distinguishing_from:
  - class: chaetoceros
    note: "Chaetoceros has thin lateral setae and clear chains with apertures; Ditylum is a box-like cell with one central spine per valve."
  - class: centric
    note: "Use Ditylum when the prismatic shape and central spine are visible; fall back to Centric when the genus is unclear."
references:
  - title: "Ditylum — UCSC PhytoGallery"
    url: http://oceandatacenter.ucsc.edu/PhytoGallery/Diatoms/ditylum.html
  - title: "Ditylum - Phyto'pedia - The Phytoplankton Encyclopaedia Project"
    url: https://phytoplankton.eoas.ubc.ca/research/phytoplankton/diatoms/centric/ditylum/d_brightwellii.html

