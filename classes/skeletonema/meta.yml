class_id: skeletonema
display_name: Skeletonema
group: Diatoms
optics: [high-mag, low-mag]
one_liner: "Small cylindrical centric diatoms in chains, linked by a ring of long external tubular processes that leave a visible gap between cells."
defining_characteristics: "Cells are small, drum- to cylinder-shaped centric diatoms joined into straight chains. Adjacent cells are connected by a ring of long strutted processes around the valve margin, leaving a characteristic open, ladder-like gap between neighbouring cells. This feature can be challenging to see in the planktivoire. Key features: chains of small cylinders, marginal ring of linking tubes, visible inter-cell gap, Two Chloroplasts per cell. Highly abundant."
distinguishing_from:
  - class: thalassiosira
    note: "Thalassiosira cells hang from a single fine central thread and sit close together; Skeletonema cells are bridged by a ring of marginal tubes with an obvious gap."
  - class: chaetoceros
    note: "Chaetoceros links cells with thin setae, can be challening to see in Planktovoire."
references:
  - title: "Skeletonema costatum - Phyto'pedia: The Phytoplankton Encyclopaedia Project (UBC)"
    url: https://phytoplankton.eoas.ubc.ca/research/phytoplankton/diatoms/centric/skeletonema/s_costatum.html
  - title: "Guide to Skeletonema — Diatoms of North America"
    url: https://diatoms.org/genera/skeletonema/guide

