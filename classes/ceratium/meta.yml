class_id: ceratium
display_name: Ceratium
group: Dinoflagellates
optics: [high-mag, low-mag]
one_liner: "Armored dinoflagellate of the genus, Tripos. Typically, one long apical horn and two or three  horns on the hypotheca."
defining_characteristics: "An armored dinoflagellate whose  plates are drawn out into long, slender horns: a single apical horn and usually two antapical horns that curve upward, giving a distinctive trident silhouette. Several species in Monterey, including ~T. divaricatum~ which hasns very short horns. The marine species are now placed in the genus Tripos, but are still often refered to as Ceratium. Key features: multiple long horns, rigid armored plates, relatively large."
distinguishing_from:
  - class: dinophysis
    note: "Dinophysis is laterally flattened with a funnel-shaped cingular list and sail-like sulcal lists, not long horns."
  - class: prorocentrum
    note: "Prorocentrum is a two-valved cell with no horns and no girdle; Ceratium has prominent apical and antapical horns."
references:
  - title: "Ceratium furca — Phyto'pedia - The Phytoplankton Encclopaedia Project (UBC)"
    url: https://phytoplankton.eoas.ubc.ca/research/phytoplankton/dinoflagellates/ceratium/c_furca.html
  - title: "UCSC PhytoGallery"
    url: http://oceandatacenter.ucsc.edu/PhytoGallery/Dinoflagellates/ceratium.html
