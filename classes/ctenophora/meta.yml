class_id: ctenophora
display_name: Ctenophora
group: Zooplankton
optics: [high-mag, low-mag]
one_liner: "Ctenophore (or Comb jelly) is a large transparent gelatinous zooplankter, often showing rows of ciliary comb plates."
defining_characteristics: "A ctenophore (comb jelly): a large, transparent, gelatinous zooplankter, typically ovoid to lobed, bearing rows of ciliary comb plates. Key features: gelatinous transparent body, comb-row bands, no hard skeleton."
distinguishing_from:
  - class: siphonophore
    note: "Siphonophores are colonial cnidarians forming chain- or ribbon-like assemblages of repeated zooids; ctenophores are single ovoid/lobed gelatinous bodies with comb rows."
  - class: larvacean
    note: "Larvaceans are small tadpole-shaped tunicates, often within a mucous house"
references:
  - title: "Ctenophores: Methods and Protocols, Methods in Molecular Biology"
    url: https://www.whitney.ufl.edu/media/wwwwhitneyufledu/images/files/Illustrated-Guide-to-Ctenophora_Moroz-et-al_2024.pdf
