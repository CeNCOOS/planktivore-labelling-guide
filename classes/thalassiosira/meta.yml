class_id: thalassiosira
display_name: Thalassiosira
group: Diatoms
optics: [high-mag, low-mag]
one_liner: "Disc- or drum-shaped centric diatoms, often in loose chains joined by a single fine central thread."
defining_characteristics: "Cells are circular in valve view and disc- to drum-shaped, with areolae in radial or fasciculate rows and a ring of marginal processes. They frequently form loose chains held together by a single thin organic thread extruded from a central process, or occur singly. Key features: circular valve, radial areolae, central-thread linkage rather than marginal tubes."
distinguishing_from:
  - class: skeletonema
    note: "Skeletonema is bridged by a ring of long marginal tubes leaving a clear gap; Thalassiosira chains hang from one fine central thread with cells close together."
  - class: centric
    note: "Use Thalassiosira when the disc shape and central-thread chains are evident; use Centric single cells (non-chain)."
references:
  - title: "Thalassiosira - UCSC PhytoGallery"
    url: http://oceandatacenter.ucsc.edu/PhytoGallery/Diatoms/thalassiosira.html
  - title: "Thalassiosira - Phyto'pedia - The Phytoplankton Encyclopaedia Project"
    url: https://phytoplankton.eoas.ubc.ca/research/phytoplankton/diatoms/centric/thalassiosira/t_anguste_lineata.html

